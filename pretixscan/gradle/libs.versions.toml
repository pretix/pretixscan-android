kotlin = "2.2.21"
legacy-support-v4 = "1.0.0"
multidex = "2.0.1"
recyclerview = "1.4.0"
sentry = "8.18.0"
slf4j-nop = "1.7.30"
splitties-toast = "3.0.0"
